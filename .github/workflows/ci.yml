# サイトの生成物が古くないか、AIO の静的な検査（ベンチマーク A）、Linux で流せるテスト（docs/site.md）。
# LLM は呼ばない（ベンチマーク B は手元の claude -p で回す）。tests/test_ios.py は macOS の道具に頼るので Mac で流す
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  site-and-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: site/public が site/src と合っているか
        run: python3 site/build.py --check
      - name: AIO の静的な検査
        run: python3 bench/aio_check.py
      - name: pytest を入れる
        run: python3 -m pip install --disable-pip-version-check pytest==9.2.0
      - name: テスト
        run: python3 -m pytest tests/test_site.py tests/test_tools.py tests/test_bench.py
